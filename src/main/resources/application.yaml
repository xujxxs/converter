spring:
  application:
    name: convertor
  kafka:
    bootstrap-servers: "${KAFKA_URL}"
  jpa:
    hibernate:
      ddl-auto: validate 
  datasource:
    url: "jdbc:postgresql://${DATABASE_URL}:5432/${DATABASE_NAME}"
    username: "${DATABASE_USERNAME}"
    password: "${DATABASE_PASSWORD}"
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}

queue:
  kafka:
    group-id: converter-group
    topic:
      file-convert: file-convert
      converted-file: converted-file

s3:
  buckets:
    downloadBucketName: "need-convert"
    saveBucketName: "converted"
  properties:
    endpointUrl: "http://${MINIO_URL}"
    region: us-east-1
    accessKey: minio
    secretKey: minio123
